    <script>
      // Gracefully prevent Vite HMR WebSocket connection failure in sandbox iframe
      (function() {
        try {
          const OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            function SafeWebSocket(url, protocols) {
              const urlStr = String(url || '');
              const isHmr = urlStr.includes('vite') || 
                            protocols === 'vite-hmr' || 
                            (Array.isArray(protocols) && protocols.includes('vite-hmr'));
              
              if (isHmr) {
                const dummy = new EventTarget();
                dummy.binaryType = 'blob';
                dummy.readyState = 1; // WebSocket.OPEN
                dummy.bufferedAmount = 0;
                dummy.extensions = '';
                dummy.protocol = 'vite-hmr';
                dummy.url = urlStr;
                dummy.onopen = null;
                dummy.onclose = null;
                dummy.onerror = null;
                dummy.onmessage = null;
                dummy.send = function() {};
                dummy.close = function(code, reason) {
                  dummy.readyState = 3;
                  if (dummy.onclose) {
                    dummy.onclose(new CloseEvent('close', { wasClean: true, code: code || 1000, reason: reason || '' }));
                  }
                };
                setTimeout(() => {
                  dummy.readyState = 1;
                  const ev = new Event('open');
                  if (dummy.onopen) dummy.onopen(ev);
                  dummy.dispatchEvent(ev);
                }, 20);
                return dummy;
              }
              return new OriginalWebSocket(url, protocols);
            }
            SafeWebSocket.prototype = OriginalWebSocket.prototype;
            SafeWebSocket.CONNECTING = 0;
            SafeWebSocket.OPEN = 1;
            SafeWebSocket.CLOSING = 2;
            SafeWebSocket.CLOSED = 3;
            window.WebSocket = SafeWebSocket;
          }
        } catch (e) {
          // ignore
        }

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(arg => {
            const str = (arg && arg.message) || String(arg || '');
            return str.includes('WebSocket') || str.includes('[vite]');
          })) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', (e) => {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('[vite]'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', (e) => {
          if (e.reason && String(e.reason).includes('WebSocket')) {
            e.preventDefault();
          }
        });

        // Capture Chrome/Android PWA beforeinstallprompt early so late-mounted modals never miss it
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          window.__deferredPWAInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
        });
        window.addEventListener('appinstalled', () => {
          window.__deferredPWAInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-app-installed'));
        });
      })();
    </script>
